robot:
  id: robot_b
  display_name: Robot B
  monitor_only: true
axes:
  drive:
    max_velocity: 6.283185307179586
    jog_velocity: 0.05
    bus: ethercat
    slave_position: 2
    encoder_counts_per_rev: 65536
    gear_ratio: 51
    position_unit: rad
    velocity_unit: rad/s
  clamp_left:
    max_velocity: 0.2
    jog_velocity: 0.1
    bus: ethercat
    slave_position: 0
    control_mode: torque
    torque_raw_min: 0
    torque_raw_max: 1000
    jog_torque: 50
  clamp_right:
    max_velocity: 0.2
    jog_velocity: 0.1
    bus: ethercat
    slave_position: 1
    control_mode: torque
    torque_raw_min: 0
    torque_raw_max: 1000
    jog_torque: 50
  z_axis:
    max_velocity: 0.00019801980198019803
    jog_velocity: 5.0e-05
    bus: ethercat
    slave_position: 3
    encoder_counts_per_rev: 65536
    gear_ratio: 101
    lead_m: 0.02
    position_unit: m
    velocity_unit: m/s
    requires_zero: false
    position_min: 0
    position_max: 0.3
hardware:
  ethercat:
    enabled: true
    backend: eyou
    executable: /home/phi/robot_test_system/.local-deps/bin/eyou_agent
    interface: enp2s0
    z_zero_counts: null
    allow_unreferenced_z: true
    read_only: true
    log_file: /home/phi/robot_test_system/logs/eyou_sdk.log
    stop_policy: zero_and_disable
  lidar:
    enabled: true
    backend: livox
    host: 192.168.10.73
    executable: /home/phi/robot_test_system/.local-deps/bin/livox_monitor
    sdk_config: /home/phi/robot_test_system/config/robot_b_site/mid360s.json
    poll_sec: 0.01
    stale_sec: 5
    model: MID360s
  canopen:
    enabled: false
    backend: real
test:
  watchdog_timeout_ms: 500
  heartbeat_hz: 1.0
  diagnostics_hz: 5.0
  auto_cycle:
    enabled: false
    axis: drive
    positive_target: 1.0
    negative_target: -1.0
    velocity: 0.1
    dwell_sec: 1.0
cameras:
  camera_1:
    enabled: true
    backend: uvc
    rgb_selector:
      name_regex: '^USB Camera:'
      preferred_path: /dev/v4l/by-path/pci-0000:00:14.0-usb-0:3:1.0-video-index0
    width: 640
    height: 480
    fps: 5
    transport: compressed
    label: USB RGB 1
  camera_2:
    enabled: true
    backend: uvc
    rgb_selector:
      name_regex: Intel.*RealSense
      preferred_path: /dev/v4l/by-path/pci-0000:00:14.0-usb-0:2:1.3-video-index0
    width: 640
    height: 480
    fps: 5
    transport: compressed
    label: RealSense RGB
  camera_3:
    enabled: true
    backend: uvc
    rgb_selector:
      name_regex: S-YUE.*USB Camera
      preferred_path: /dev/v4l/by-path/pci-0000:00:14.0-usb-0:1:1.0-video-index0
    width: 640
    height: 480
    fps: 5
    transport: compressed
    label: S-YUE RGB
